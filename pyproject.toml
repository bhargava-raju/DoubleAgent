[project]
name = "doubleagent"
version = "0.1.0"
description = "Procurement assistant agent: learning agentic AI in Python"
readme = "README.md"
authors = [{ name = "Bhargava" }]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.11.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
doubleagent = "doubleagent.cli:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
